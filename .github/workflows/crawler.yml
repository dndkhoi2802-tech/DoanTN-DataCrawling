name: IUH Auto Crawler

on:
  schedule:
    - cron: '*/5 * * * *' # Cú pháp cron: chạy mỗi 5 phút
  workflow_dispatch: # Nút bấm để bạn có thể tự chạy thủ công lúc đang test

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 undetected-chromedriver ddddocr selenium

      - name: Run Crawler Script
        env:
          IUH_USERNAME: ${{ secrets.IUH_USERNAME }}
          IUH_PASS: ${{ secrets.IUH_PASS }}
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save History back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sent_posts.json
          # Nếu có bài đăng mới (file json bị thay đổi), nó sẽ commit ngược lên github
          git commit -m "Auto-update crawler history" || exit 0
          git push
# Kich hoat lai server
